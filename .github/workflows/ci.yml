# CI Workflow
# Runs on pull requests and pushes to main, develop, and feature branches.
# Steps: checkout, setup Python, install deps, lint, test, type check, build.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"

# Cancel in-progress runs for the same branch to save resources
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python setup with dependency caching ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install dev/quality tooling (not in requirements.txt for prod)
          pip install flake8 mypy pytest httpx

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Run lint (flake8)
        run: |
          flake8 src/ \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --count \
            --statistics

      # ── Type checks ───────────────────────────────────────────────────────
      - name: Run type checks (mypy)
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --no-strict-optional

      # ── Unit tests ────────────────────────────────────────────────────────
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests directory found – skipping"

      # ── Build (Docker image) ───────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            --tag app:${{ github.sha }} \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref_name }}" \
            .
